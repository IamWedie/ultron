name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore app
        run: dotnet restore Ultron.csproj

      - name: Restore tests
        run: dotnet restore tools/Tests/Ultron.Tests.csproj

      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Unit tests
        run: dotnet test tools/Tests/Ultron.Tests.csproj --no-restore

      - name: Build app
        run: dotnet build Ultron.csproj --no-restore --no-dependencies -c Debug

      - name: Python checks
        run: python backend/ci.py