name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5.5.0
        with:
          python-version: '3.12'

      - name: Restore app
        run: dotnet restore Ultron.csproj

      - name: Restore tests
        run: dotnet restore tools/Tests/Ultron.Tests.csproj

      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements.lock

      - name: Unit tests
        run: dotnet test tools/Tests/Ultron.Tests.csproj --no-restore

      - name: Build app
        run: dotnet build Ultron.csproj --no-restore --no-dependencies -c Debug

      - name: Python checks
        run: python backend/ci.py